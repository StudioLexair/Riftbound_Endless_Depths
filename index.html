<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0f18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Riftbound: Endless Depths. RPG original por turnos, pixel art y exploración procedural.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/ui/icon-192.png">
<link rel="apple-touch-icon" href="./assets/ui/icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>Riftbound: Endless Depths</title>
</head>
<body>
<div id="loading" role="status" aria-label="Cargando el juego">
  <div class="load-box">
    <img class="load-logo" src="./assets/ui/logo.svg" alt="Riftbound: Endless Depths">
    <div class="load-rune" aria-hidden="true"></div>
    <div class="load-track"><i id="load-bar"></i></div>
    <p id="load-text">Abriendo la grieta…</p>
    <p id="load-pct">0%</p>
    <p class="load-tip" id="load-tip">Cada paso consume un turno. Los enemigos solo se mueven cuando tú lo haces.</p>
  </div>
</div>
<main id="shell">
  <section id="home"></section>
  <section id="play" hidden>
    <header id="hud"></header>
    <div id="view">
      <canvas id="world" aria-label="Mapa de la mazmorra"></canvas>
      <div id="log" aria-live="polite"></div>
    </div>
    <nav id="toolbar" aria-label="Menús de partida">
      <button data-ui="inventory"><span class="uicon" style="background-position:0 0"></span><small>MOCHILA</small></button>
      <button data-ui="skills"><span class="uicon" style="background-position:-28px 0"></span><small>ÁRBOL</small></button>
      <button data-ui="quests"><span class="uicon" style="background-position:-56px 0"></span><small>MISIONES</small></button>
      <button data-ui="map"><span class="uicon" style="background-position:-84px 0"></span><small>MAPA</small></button>
      <button data-ui="pause"><span class="uicon" style="background-position:0 -28px"></span><small>PAUSA</small></button>
    </nav>
    <section id="controls">
      <div id="actions">
        <button data-action="attack" class="primary"><span class="uicon" style="background-position:-28px -28px"></span><small>ATACAR</small></button>
        <button data-action="interact"><span class="uicon" style="background-position:-56px -28px"></span><small>USAR</small></button>
        <div id="skillbar"></div>
        <button data-action="wait"><span class="uicon" style="background-position:-84px -28px"></span><small>ESPERAR</small></button>
        <button data-action="heal"><span class="uicon" style="background-position:0 -56px"></span><small>CURAR</small></button>
      </div>
      <p class="ctl-hint">Desliza sobre el mapa o toca en una dirección para moverte · Toca el centro para esperar</p>
    </section>
  </section>
  <footer id="status" role="status"></footer>
</main>
<dialog id="dialog">
  <header><h2 id="dialog-title"></h2><button id="close" aria-label="Cerrar ventana">X</button></header>
  <div id="dialog-body"></div>
</dialog>
<script type="module" src="./src/core/main.js"></script>
</body>
</html>
